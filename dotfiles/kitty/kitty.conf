# Managed by os-setup (dotfiles/kitty/kitty.conf).

# New tab starts in the shell's directory. last_reported (via kitty's zsh shell
# integration) rather than new_tab_with_cwd, which follows the newest foreground
# process: with helix open that's a language server, e.g. pyright's dist dir.
map ctrl+shift+t launch --type=tab --cwd=last_reported

# Splits layout: choose split direction per window. 'stack' kept so
# ctrl+shift+l can still cycle to a fullscreen view of the current pane.
enabled_layouts splits,stack

# Split side by side (|) and one above the other (-), in the shell's directory
# (last_reported, same reason as the tab mapping above).
map ctrl+shift+backslash launch --location=vsplit --cwd=last_reported
map ctrl+shift+minus     launch --location=hsplit --cwd=last_reported
map ctrl+shift+enter     launch --location=split  --cwd=last_reported

# Move between splits
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# Rotate a split between horizontal and vertical
map ctrl+shift+period layout_action rotate
